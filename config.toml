# ============================================================
#  تنظیمات «فریلنس‌یار آرنا» (frilanser)
#  هر مقداری را اینجا تغییر دهید؛ برنامه هنگام اجرا دوباره می‌خواند.
# ============================================================

[app]
react_dir = "outbox/react"
name = "فریلنس‌یار آرنا"
owner = "شما"
timezone = "Asia/Tehran"
data_dir = "data"
raw_dir = "data/raw"
cache_dir = "data/cache"
outbox_dir = "outbox"
demo_dir = "outbox/demos"
report_dir = "outbox/reports"

[pricing]
# ---- حالت تازه‌کار ----
# چون سابقه‌ی کمی در این سایت‌ها داریم، قیمت را کمی رقابتی‌تر می‌بندیم تا
# نبودِ سابقه را جبران کند. false بگذارید اگر نمی‌خواهید.
newcomer_mode = true
newcomer_discount_high = 0.15      # پروژه‌هایی که احتمال واگذاری به تازه‌کار در آن‌ها زیاد است
newcomer_discount_medium = 0.10
newcomer_discount_low = 0.05
newcomer_floor_share = 0.85        # سقف تخفیف: پایین‌تر از ۸۵٪ کفِ مبلغ نرود

# نرخ ساعتی پایه (تومان) - بر اساس این نرخ قیمت پیشنهادی محاسبه می‌شود
hourly_rate_toman = 450000
# کف مبلغ هر پروژه (تومان) - پروژه‌های ارزان‌تر از این به‌صرفه نیست
min_project_price_toman = 5000000
# گرد کردن قیمت پیشنهادی به نزدیک‌ترین مضرب این عدد
round_to_toman = 500000
# کمیسیون تقریبی پلتفرم (مثلاً ۱۰٪) که در قیمت‌گذاری لحاظ می‌شود
platform_commission = 0.10
# حاشیه امن بابت ریسک و ابهام پروژه
risk_buffer = 0.15
# سقف زمان قابل قبول برای اجرا در آرنا (ساعت). پروژه‌های بزرگ‌تر رد می‌شوند.
max_hours = 24
# تعداد ساعت کاری در روز برای تبدیل ساعت به روز تحویل
work_hours_per_day = 6

[pricing.complexity_multiplier]
data_pipeline = 1.0
automation = 0.9
bot = 1.0
ai_app = 1.2
web_app = 1.0
landing = 0.8
dashboard = 1.1
chrome_extension = 0.9
mobile_app = 1.3
plugin_cms = 1.0
content = 0.6
data_entry = 0.6
design = 0.8
seo = 1.0
teaching = 1.0
other = 1.0

[screening]
# امتیاز اجراپذیری در آرنا (۰ تا ۱۰۰)
min_score_candidate = 70
min_score_review = 45
# تعداد پیشنهادهای رقبا
high_bids_penalty_at = 20
max_bids_penalty_at = 35
# حداقل طول توضیحات پروژه (کاراکتر) - کمتر از این یعنی ابهام زیاد
min_description_chars = 150
# جریمه‌ی امتیازها
penalty_high_bids = 8
penalty_max_bids = 12
bonus_low_competition = 4
penalty_no_budget = 5
penalty_vague = 6
penalty_needs_access = 10
penalty_result_contingent = 25
penalty_human_operation = 20
penalty_licensed_software = 10
bonus_clear_deliverable = 5

[sources.ponisha]
enabled = true
label = "پونیشا"
base_url = "https://ponisha.ir"
listing_url = "https://ponisha.ir/search/projects"
project_url_prefix = "https://ponisha.ir/project/"
fee_note = "تسویه از طریق پلتفرم"

[sources.karlancer]
enabled = true
label = "کارلنسر"
base_url = "https://www.karlancer.com"
listing_url = "https://www.karlancer.com/search"
project_url_prefix = "https://www.karlancer.com/projects/"
fee_note = "تسویه از طریق پلتفرم"

[sources.karlancer_programming]
enabled = true
label = "کارلنسر - برنامه‌نویسی"
base_url = "https://www.karlancer.com"
listing_url = "https://www.karlancer.com/jobs/programming"
project_url_prefix = "https://www.karlancer.com/projects/"
kind = "karlancer"
fee_note = "تسویه از طریق پلتفرم"

[sources.karlancer_web_design]
enabled = true
label = "کارلنسر - طراحی سایت"
base_url = "https://www.karlancer.com"
listing_url = "https://www.karlancer.com/jobs/web-design"
project_url_prefix = "https://www.karlancer.com/projects/"
kind = "karlancer"
fee_note = "تسویه از طریق پلتفرم"

[sources.parscoders]
enabled = true
label = "پارس‌کدرز"
base_url = "https://parscoders.com"
listing_url = "https://parscoders.com/project"
project_url_prefix = "https://parscoders.com/project/"
kind = "parscoders"
fee_note = "تسویه از طریق پلتفرم"

[fetch]
# اگر false باشد، فقط از اسنپ‌شات‌های داخل data/raw استفاده می‌شود (بدون اینترنت)
allow_network = true
timeout_seconds = 25
delay_between_requests = 2.0
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"

[notify]
# کارهایی که باید حتماً توسط شما انجام شود
kinds = [
    "approve",          # تایید پروژه قبل از شروع
    "submit_proposal",  # ثبت پیشنهاد در سایت فریلنسری (با متن آماده)
    "provide_access",   # گرفتن دسترسی/اطلاعات از کارفرما
    "deliver",          # تحویل پروژه در سایت
]


# ------------------------------------------------------------------ دموها
[demo]
# خروجی پیش‌فرض: html (پیش‌نمایش قفل‌شده) | react (پروژه‌ی واقعی) | both (هردو)
stack = "html"
# سبک طراحی پیش‌نمایش‌ها: auto (انتخاب خودکار از روی آگهی) یا یکی از:
# soft_saas, glassmorphism, neumorphism, minimal, brutalist, dark_elegant,
# luxury_gold, neon_tech, corporate, warm_editorial, playful,
# medical_clean, ocean_trust, rose_shop
style = "auto"

# ---- به‌روزرسانی درون‌برنامه‌ای ----
[update]
# مانیفست نسخه (خالی = آدرس پیش‌فرض روی شاخه). می‌توانید آینه‌ی دلخواه خودتان را بگذارید.
manifest_url = ""
# بررسی خودکار هنگام بالا آمدن داشبورد (true/false)
auto_check = false
