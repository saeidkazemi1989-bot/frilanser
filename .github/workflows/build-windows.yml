name: build-windows-exe

on:
  push:
    branches: ["**"]          # هر push روی هر شاخه → ساخت فایل اجرایی
    tags: ["v*"]              # تگ نسخه → انتشار در Release
    paths:                    # فقط وقتی چیزی که روی خروجی اثر دارد تغییر کند
      - "frilanser/**"
      - "frilanser_app.py"
      - "config.toml"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"            # پشتیبانی از متن فارسی در خروجی ویندوز
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: python -m pip install --upgrade pip pyinstaller Flask requests beautifulsoup4

      - name: تست سریع قبل از بیلد
        continue-on-error: true
        run: python -m frilanser run --demos 1

      - name: ساخت فایل اجرایی ویندوز
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name frilanser \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser_app.py
          ls -la dist

      - name: ساخت نسخه‌ی گرافیکی (GUI)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name frilanser-gui \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser_gui.py
          ls -la dist

      - name: بسته‌ی پرتابل (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\frilanser.exe, dist\frilanser-gui.exe, config.toml, README.md, scripts\start-gui.bat portable\
          New-Item -ItemType Directory -Force -Path portable\data | Out-Null
          Copy-Item -Recurse data\raw portable\data\raw
          Compress-Archive -Path portable\* -DestinationPath dist\frilanser-portable.zip
          Get-Item dist\frilanser-portable.zip | Select-Object Name, Length

      - name: ساخت نصب‌کننده (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "dist/installer.log"
          "=== جستجوی Inno Setup ===" | Out-File -FilePath $log -Encoding utf8
          $iscc = $null
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) { $iscc = $cmd.Source }
          $candidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                          "C:\Program Files\Inno Setup 6\ISCC.exe")
          foreach ($c in $candidates) { if (-not $iscc -and (Test-Path $c)) { $iscc = $c } }
          if (-not $iscc) {
            $found = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          "iscc path: $iscc" | Out-File -FilePath $log -Append -Encoding utf8
          if ($iscc) {
            & $iscc "/Odist" scripts\installer.iss 2>&1 | Tee-Object -FilePath $log -Append
            "exit=$LASTEXITCODE" | Out-File -FilePath $log -Append -Encoding utf8
          } else {
            "Inno Setup پیدا نشد" | Out-File -FilePath $log -Append -Encoding utf8
          }
          Get-ChildItem dist | Out-File -FilePath $log -Append -Encoding utf8
          Get-Content $log

      - name: تست نسخه‌ی اجرایی (smoke test)
        continue-on-error: true
        shell: bash
        run: |
          WORK="${GITHUB_WORKSPACE}/dist"
          TESTDIR="${RUNNER_TEMP}/exetest"
          mkdir -p "$TESTDIR"
          {
            echo "runner_temp=${RUNNER_TEMP}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "testdir=${TESTDIR}"
          } > "$WORK/ci-env.txt" 2>&1
          cd "$TESTDIR"
          echo "cwd_after_cd=$(pwd)" >> "$WORK/ci-env.txt"
          "${WORK}/frilanser.exe" --help > "$WORK/help.log" 2>&1
          echo "help_exit=$?" >> "$WORK/help.log"
          "${WORK}/frilanser.exe" paths > "$WORK/paths.log" 2>&1
          echo "paths_exit=$?" >> "$WORK/paths.log"
          "${WORK}/frilanser.exe" paths > "$WORK/paths-after.log" 2>&1
          "${WORK}/frilanser.exe" run --demos 1 > "$WORK/run.log" 2>&1
          echo "run_exit=$?" >> "$WORK/run.log"
          ls -R . > "$WORK/tree.log" 2>&1
          {
            echo "# گزارش تست نسخه‌ی اجرایی ویندوز (frilanser.exe)"
            echo
            echo "خروجی exit=0 به‌معنی اجرای موفق است."
            echo
            echo "## frilanser.exe --help"
            echo '```'
            head -25 "$WORK/help.log"
            echo '```'
            echo
            echo "## frilanser.exe run --demos 1"
            echo '```'
            head -60 "$WORK/run.log"
            echo '```'
            echo
            echo "## فایل‌های تولیدشده توسط EXE"
            echo '```'
            head -30 "$WORK/tree.log"
            echo '```'
          } > "$WORK/ci-report.md" 2>&1
          echo "== فایل‌های dist بعد از تست =="
          ls -la "$WORK"

      - name: بارگذاری فایل اجرایی و گزارش تست
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frilanser-windows-exe
          path: |
            dist/frilanser.exe
            dist/frilanser-gui.exe
            dist/frilanser-portable.zip
            dist/Frilanser-Setup.exe
            dist/installer.log
            dist/ci-report.md
            dist/ci-env.txt
            dist/help.log
            dist/paths.log
            dist/paths-after.log
            dist/run.log
            dist/tree.log

      - name: کامیت فایل اجرایی و گزارش در شاخه‌ی جاری
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/frilanser.exe
          for f in frilanser-gui.exe frilanser-portable.zip Frilanser-Setup.exe installer.log; do
            if [ -f "dist/$f" ]; then git add -f "dist/$f"; fi
          done
          for f in ci-report.md; do
            if [ -f "dist/$f" ]; then
              git add -f "dist/$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "تغییری برای کامیت نیست"
          else
            git commit -m "ساخت خودکار: dist/frilanser.exe (ویندوز) + گزارش تست"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
