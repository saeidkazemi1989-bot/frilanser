name: build-windows-exe

on:
  push:
    branches: ["**"]          # هر push روی هر شاخه → ساخت و بارگذاری فایل اجرایی
    tags: ["v*"]              # تگ نسخه → علاوه بر آن، انتشار در Release
  workflow_dispatch:          # اجرای دستی از تب Actions (وقتی روی شاخه‌ی پیش‌فرض باشد)

permissions:
  contents: write

env:
  PYTHONUTF8: "1"            # پشتیبانی از متن فارسی در خروجی ویندوز
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: python -m pip install --upgrade pip pyinstaller Flask requests beautifulsoup4

      - name: تست سریع قبل از بیلد
        continue-on-error: true
        run: python -m frilanser run --demos 1

      - name: ساخت فایل اجرایی ویندوز
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name frilanser \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser/__main__.py
          ls -la dist

      - name: تست نسخه‌ی اجرایی (smoke test)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/exetest" && cd "$RUNNER_TEMP/exetest"
          "$GITHUB_WORKSPACE/dist/frilanser.exe" --help > help.log 2>&1
          echo "exit=$?" >> help.log
          "$GITHUB_WORKSPACE/dist/frilanser.exe" run --demos 1 > run.log 2>&1
          echo "exit=$?" >> run.log
          echo "== خروجی‌های تولیدشده توسط EXE ==" > tree.log
          ls -R . >> tree.log 2>&1
          cp help.log run.log tree.log "$GITHUB_WORKSPACE/dist/"

          # گزارش متنی برای بررسی از راه دور (در مخزن کامیت می‌شود)
          {
            echo "# گزارش تست نسخه‌ی اجرایی ویندوز"
            echo
            echo "- ساخته‌شده با PyInstaller روی windows-latest"
            echo "- خروجی exit=0 یعنی اجرای موفق"
            echo
            echo '## frilanser.exe --help'
            echo '```'
            cat help.log
            echo '```'
            echo
            echo '## frilanser.exe run --demos 1'
            echo '```'
            head -60 run.log
            echo '```'
            echo
            echo '## فایل‌های تولیدشده'
            echo '```'
            head -40 tree.log
            echo '```'
          } > "$GITHUB_WORKSPACE/dist/ci-report.md"

      - name: بارگذاری فایل اجرایی و لاگ تست
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frilanser-windows-exe
          path: |
            dist/frilanser.exe
            dist/help.log
            dist/run.log
            dist/tree.log

      - name: کامیت فایل اجرایی در شاخه‌ی جاری
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo "== dist =="
            ls -la dist 2>&1
            echo "== add =="
            git add -f dist/frilanser.exe 2>&1
            for f in ci-report.md help.log run.log tree.log ci-debug.log; do
              [ -f "dist/$f" ] && git add -f "dist/$f" 2>&1
            done
            echo "== status =="
            git status --short 2>&1 | head -20
            echo "== commit =="
            git commit -m "ساخت خودکار: dist/frilanser.exe (ویندوز)" 2>&1
            echo "== push =="
            git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1
            echo "push_exit=$?"
          } > dist/ci-debug.log 2>&1
          cat dist/ci-debug.log

      - name: لاگ‌ها را از مسیر API هم می‌فرستیم (برای بررسی از راه دور)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in ci-debug run help tree; do
            src="dist/$f.log"
            [ -f "$src" ] || continue
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/dist/ci-$f.log" \
              -f message="ci: لاگ $f" -f branch="${GITHUB_REF_NAME}" \
              -f content="$(cat "$src")" > /dev/null 2>&1 \
              && echo "ارسال شد: ci-$f.log" || echo "ارسال نشد: ci-$f.log"
          done
