name: build-windows-exe

on:
  push:
    branches: ["**"]          # هر push روی هر شاخه → ساخت و بارگذاری فایل اجرایی
    tags: ["v*"]              # تگ نسخه → علاوه بر آن، انتشار در Release
  workflow_dispatch:          # اجرای دستی از تب Actions (وقتی روی شاخه‌ی پیش‌فرض باشد)

permissions:
  contents: write

env:
  PYTHONUTF8: "1"            # پشتیبانی از متن فارسی در خروجی ویندوز
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: python -m pip install --upgrade pip pyinstaller Flask requests beautifulsoup4

      - name: تست سریع قبل از بیلد
        continue-on-error: true
        run: python -m frilanser run --demos 1

      - name: ساخت فایل اجرایی ویندوز
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name frilanser \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser/__main__.py

      - name: تست نسخه‌ی اجرایی (smoke test)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/exetest" && cd "$RUNNER_TEMP/exetest"
          "$GITHUB_WORKSPACE/dist/frilanser.exe" --help > help.log 2>&1
          echo "exit=$?" >> help.log
          "$GITHUB_WORKSPACE/dist/frilanser.exe" run --demos 1 > run.log 2>&1
          echo "exit=$?" >> run.log
          echo "== خروجی‌های تولیدشده توسط EXE ==" > tree.log
          ls -R . >> tree.log 2>&1
          cp help.log run.log tree.log "$GITHUB_WORKSPACE/dist/"

      - name: بارگذاری فایل اجرایی و لاگ تست
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frilanser-windows-exe
          path: |
            dist/frilanser.exe
            help.log
            run.log
            tree.log

      - name: انتشار در Release (فقط برای تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/frilanser.exe

      - name: کامیت فایل اجرایی در شاخه‌ی جاری
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/frilanser.exe dist/help.log dist/run.log dist/tree.log
          if git diff --cached --quiet; then
            echo "تغییری برای کامیت نیست"
          else
            git commit -m "ساخت خودکار: dist/frilanser.exe (ویندوز)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
