name: build-windows-exe

on:
  push:
    branches: ["**"]          # هر push روی هر شاخه → ساخت فایل اجرایی
    tags: ["v*"]              # تگ نسخه → انتشار در Release
    paths:                    # فقط وقتی چیزی که روی خروجی اثر دارد تغییر کند
      - "frilanser/**"
      - "frilanser_app.py"
      - "frilanser_gui.py"
      - "scripts/**"
      - "tests/**"
      - "config.toml"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"            # پشتیبانی از متن فارسی در خروجی ویندوز
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: python -m pip install --upgrade pip pyinstaller Flask requests beautifulsoup4

      - name: تست سریع قبل از بیلد
        continue-on-error: true
        run: python -m frilanser run --demos 1

      - name: ساخت فایل اجرایی ویندوز
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name frilanser \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser_app.py
          ls -la dist

      - name: ساخت نسخه‌ی گرافیکی (GUI)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name frilanser-gui \
            --add-data="config.toml;." \
            --add-data="frilanser/web/templates;frilanser/web/templates" \
            --add-data="frilanser/web/static;frilanser/web/static" \
            --add-data="data/raw;data/raw" \
            --add-data="README.md;." \
            --hidden-import=flask --hidden-import=jinja2 --hidden-import=werkzeug \
            --hidden-import=bs4 --hidden-import=requests \
            frilanser_gui.py
          ls -la dist

      - name: بسته‌ی پرتابل (ZIP)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'EOF' > dist/zip.log 2>&1
          import shutil, sys
          from pathlib import Path
          try:
              port = Path("portable")
              if port.exists():
                  shutil.rmtree(port)
              (port / "data").mkdir(parents=True)
              for f in ["dist/frilanser.exe", "dist/frilanser-gui.exe", "config.toml",
                        "README.md", "scripts/start-gui.bat"]:
                  shutil.copy2(f, port / Path(f).name)
              shutil.copytree("data/raw", port / "data" / "raw")
              shutil.make_archive("dist/frilanser-portable", "zip", root_dir="portable")
              print("ساخته شد:", Path("dist/frilanser-portable.zip").stat().st_size, "بایت")
          except Exception as exc:
              print("خطا:", exc)
              sys.exit(1)
          EOF
          echo "zip_exit=$?" >> dist/zip.log
          cat dist/zip.log

      - name: ساخت نصب‌کننده (Inno Setup)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'EOF' > dist/installer.log 2>&1
          import glob, subprocess
          from pathlib import Path
          cands = [
              "C:/Program Files (x86)/Inno Setup 6/ISCC.exe",
              "C:/Program Files/Inno Setup 6/ISCC.exe",
          ]
          cands += sorted(glob.glob("C:/Program Files*/Inno Setup*/ISCC.exe"))
          iscc = next((c for c in cands if Path(c).exists()), None)
          print("iscc:", iscc or "پیدا نشد")
          if iscc:
              r = subprocess.run([iscc, "/Odist", "scripts\\installer.iss"],
                                 capture_output=True, text=True)
              print("exit:", r.returncode)
              print("--- stdout ---")
              print(r.stdout)
              print("--- stderr ---")
              print(r.stderr)
          print("--- محتوای dist ---")
          for f in sorted(Path("dist").iterdir()):
              print(f"{f.name}: {f.stat().st_size} بایت")
          EOF
          cat dist/installer.log

      - name: تست نسخه‌ی اجرایی (smoke test)
        continue-on-error: true
        shell: bash
        run: |
          WORK="${GITHUB_WORKSPACE}/dist"
          TESTDIR="${RUNNER_TEMP}/exetest"
          mkdir -p "$TESTDIR"
          {
            echo "runner_temp=${RUNNER_TEMP}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "testdir=${TESTDIR}"
          } > "$WORK/ci-env.txt" 2>&1
          cd "$TESTDIR"
          echo "cwd_after_cd=$(pwd)" >> "$WORK/ci-env.txt"
          "${WORK}/frilanser.exe" --help > "$WORK/help.log" 2>&1
          echo "help_exit=$?" >> "$WORK/help.log"
          "${WORK}/frilanser.exe" paths > "$WORK/paths.log" 2>&1
          echo "paths_exit=$?" >> "$WORK/paths.log"
          "${WORK}/frilanser.exe" paths > "$WORK/paths-after.log" 2>&1
          "${WORK}/frilanser.exe" run --demos 1 > "$WORK/run.log" 2>&1
          echo "run_exit=$?" >> "$WORK/run.log"
          ls -R . > "$WORK/tree.log" 2>&1
          {
            echo "# گزارش تست نسخه‌ی اجرایی ویندوز (frilanser.exe)"
            echo
            echo "خروجی exit=0 به‌معنی اجرای موفق است."
            echo
            echo "## frilanser.exe --help"
            echo '```'
            head -25 "$WORK/help.log"
            echo '```'
            echo
            echo "## frilanser.exe run --demos 1"
            echo '```'
            head -60 "$WORK/run.log"
            echo '```'
            echo
            echo "## فایل‌های تولیدشده توسط EXE"
            echo '```'
            head -30 "$WORK/tree.log"
            echo '```'
          } > "$WORK/ci-report.md" 2>&1
          echo "== فایل‌های dist بعد از تست =="
          ls -la "$WORK"

      - name: بارگذاری فایل اجرایی و گزارش تست
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frilanser-windows-exe
          path: |
            dist/frilanser.exe
            dist/frilanser-gui.exe
            dist/frilanser-portable.zip
            dist/Frilanser-Setup.exe
            dist/installer.log
            dist/ci-report.md
            dist/ci-env.txt
            dist/help.log
            dist/paths.log
            dist/paths-after.log
            dist/run.log
            dist/tree.log

      - name: کامیت فایل اجرایی و گزارش در شاخه‌ی جاری
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/frilanser.exe
          for f in frilanser-gui.exe frilanser-portable.zip Frilanser-Setup.exe installer.log zip.log; do
            if [ -f "dist/$f" ]; then git add -f "dist/$f"; fi
          done
          for f in ci-report.md; do
            if [ -f "dist/$f" ]; then
              git add -f "dist/$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "تغییری برای کامیت نیست"
          else
            git commit -m "ساخت خودکار: dist/frilanser.exe (ویندوز) + گزارش تست"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
